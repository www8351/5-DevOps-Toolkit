name: python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_TARGETS: 04-network-ssh/ssh_toolkit 04-network-ssh/tests 05-docker-devops/ec2-deploy.py 05-docker-devops/tests
  PY_TESTS: 04-network-ssh/tests 05-docker-devops/tests

jobs:
  lint:
    name: py_compile + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dev dependencies (pinned)
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: find 04-network-ssh/ssh_toolkit 05-docker-devops -name '*.py' -exec python -m py_compile {} +

      - name: Ruff (syntax + pyflakes)
        # E9 syntax and every pyflakes rule (F): unused imports and variables,
        # undefined names, logic slips. Still no style rules (D11, D20).
        run: |
          # shellcheck disable=SC2086  # the target list is meant to split
          ruff check --select E9,F $PY_TARGETS

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest stable release.
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies (pinned)
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          # shellcheck disable=SC2086  # the test list is meant to split
          pytest $PY_TESTS -q
