name: python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PY_TARGETS: 04-network-ssh/ssh_toolkit 04-network-ssh/tests 05-docker-devops/ec2-deploy.py 05-docker-devops/tests
  PY_TESTS: 04-network-ssh/tests 05-docker-devops/tests

jobs:
  lint:
    name: py_compile + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Compile check
        run: python -m py_compile $(find 04-network-ssh/ssh_toolkit 05-docker-devops -name '*.py')

      - name: Ruff (syntax + pyflakes)
        # E9 syntax and every pyflakes rule (F): unused imports and variables,
        # undefined names, logic slips. Still no style rules (D11).
        run: ruff check --select E9,F $PY_TARGETS

  pytest:
    name: pytest (ssh_toolkit + ec2-deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest $PY_TESTS -q
